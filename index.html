<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Futbolle</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Futbolle</h1>
      <div class="headerButtons">
        <button>Help</button>
        <button>Stats</button>
      </div>
    </header>
    <main>
      <!-- Vista de Inicio -->
      <section id="startView" ">
        <p>
          Adivina el jugador secreto en 8 intentos. Las pistas te indicarán
          nacionalidad, club, posición, edad, valoración global y altura.
          Selecciona tu nivel y demuestra cuánto sabes.
        </p>
        <form id="startForm">
          <label id="userName">
            Ingresa tu nombre:
            <input type="text" name="userName" minlength="3" required />
          </label>
          <fieldset id="levelFieldset">
            <legend>Selecciona tu nivel:</legend>
            <div id="labels">
              <input type="radio" id="easy" name="level" value="easy" checked />
              <label for="easy">Fácil</label>
              <input type="radio" id="normal" name="level" value="normal" />
              <label for="normal">Medio</label>
              <input type="radio" id="hard" name="level" value="hard" />
              <label for="hard">Difícil</label>
            </div>
          </fieldset>
          <button type="submit" id="startButton">Iniciar Juego</button>
        </form>
      </section>
      <!-- Vista de juego -->
      <section id="gameView" class="hidden">
        <div id="gameControls">
          <div id="timerDisplay">00:00</div>
          <div id="searchWrapper">
            <input
              type="text"
              id="searchInput"
              placeholder="Escribe un jugador..."
            />
            <ul id="autocompleteList" class="hidden"></ul>
          </div>
        </div>

        <div id="photoHintContainer" class="hidden">
          <img id="secretPlayerPhoto" src="" alt="Pista del jugador" />
        </div>
        <div id="textHintContainer" class="hidden"></div>
        <div id="boardContainer">
          <div id="boardHeader">
            <span class="colStat">Nom</span>
            <span class="colStat">Pais</span>
            <span class="colStat">Club</span>
            <span class="colStat">Pos</span>
            <span class="colStat">Edad</span>
            <span class="colStat">Val</span>
            <span class="colStat">Alt</span>
          </div>
          <!-- ACA VAN LOS INTENTOS DESDE JS -->
          <div id="attemptsContainer"></div>
        </div>
      </section>
      <dialog id="winnerDialog">
        <p id="winnerMessage"></p>
        <button id="btnRestartWin" class="restartButton">Jugar de Nuevo</button>
      </dialog>
      <dialog id="loserDialog">
        <p id="loserMessage"></p>
        <button id="btnRestartLose" class="restartButton">Intentar otra vez</button>
      </dialog>
    </main>
    <footer class="footer">
      <p>Este es el footer bro</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
